<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Luna & Misifu - Tamagochi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#000000;
    display:flex;flex-direction:column;align-items:center;
    padding:20px 16px 40px;min-height:100vh;
    font-family:'Press Start 2P',monospace;color:#fff;
  }
  .title{font-size:9px;color:#888888;letter-spacing:4px;margin-bottom:3px;}
  .sub{font-size:6px;color:#555555;letter-spacing:2px;margin-bottom:14px;}

  #world{
    width:1300px;height:750px;
    position:relative;overflow:hidden;
    border:2px solid #111111;border-radius:4px;
    margin-bottom:14px;cursor:default;user-select:none;
  }
  #bgcanvas{position:absolute;inset:0;}
  #canvas{position:absolute;inset:0;cursor:grab;}
  #canvas.grabbing{cursor:grabbing;}

  #bubble{
    position:absolute;font-family:monospace;font-size:12px;color:#fff;
    background:#111;border:1px solid #444;border-radius:4px;
    padding:3px 8px;pointer-events:none;opacity:0;
    transition:opacity 0.25s;white-space:nowrap;z-index:20;
  }
  #bubble.show{opacity:1;}
  #clock{position:absolute;top:6px;right:8px;font-size:6px;color:#ffffff55;z-index:5;pointer-events:none;}

  /* piso selector - oculto */
  #floorbtns{display:none;}
  .fbtn{display:none;}

  .stats{width:1100px;display:none;}
  .stats.misifu-stats{width:1100px;display:none;}
  .stat{display:none;}
  .sn{display:none;}
  .bb{display:none;}
  .bar{display:none;}

  .btns{width:1100px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .btns.misifu-btns{width:1100px;margin-top:8px;}
  .btn{
    background:#0a0a0a;border:none;border-radius:0;
    padding:0;font-family:'Press Start 2P',monospace;
    font-size:6px;color:#444444;cursor:pointer;text-align:center;line-height:1.6;
    transition:color .15s,transform .1s;
    white-space:pre;
  }
  .btn:hover{background:#0a0a0a;}
  .btn:active{transform:scale(.96);}
  .btn.food:hover{color:#ff9966;}
  .btn.fun:hover{color:#66ccff;}
  .btn.love:hover{color:#ff66aa;}
  .btn.sleep:hover{color:#aa88ff;}
  .msgarea{font-size:7px;color:#444444;margin-top:10px;min-height:14px;letter-spacing:1px;width:1100px;}
</style>
</head>
<body>
<div class="title">* LUNA *</div>
<div class="sub">en memoria de mama &lt;3</div>

<div id="world">
  <canvas id="bgcanvas" width="1300" height="750"></canvas>
  <canvas id="canvas"   width="1300" height="750"></canvas>
  <div id="bubble"></div>
  <div id="clock"></div>
  <div id="patio-overlay" style="display:none;position:absolute;inset:0;z-index:30;cursor:default;">
    <canvas id="patio-canvas" width="1300" height="750" style="position:absolute;inset:0;"></canvas>
    <div style="position:absolute;bottom:18px;right:24px;font-family:'Press Start 2P',monospace;font-size:7px;color:#664422;cursor:pointer;z-index:31;" onclick="closePatio()">[ volver &lt;- ]</div>
  </div>
</div>

<div id="floorbtns">
  <button class="fbtn active" onclick="setFloor(0)" id="fb0">piso 1</button>
  <button class="fbtn"        onclick="setFloor(1)" id="fb1">segundo piso</button>
</div>

<div class="stats">
  <div class="stat"><div class="sn">comida</div><div class="bb"><div class="bar bf"  id="barf" style="width:70%"></div></div></div>
  <div class="stat"><div class="sn">juego</div> <div class="bb"><div class="bar bfu" id="barfu"style="width:60%"></div></div></div>
  <div class="stat"><div class="sn">amor</div>  <div class="bb"><div class="bar bl"  id="barl" style="width:80%"></div></div></div>
  <div class="stat"><div class="sn">sueno</div> <div class="bb"><div class="bar bs"  id="bars" style="width:50%"></div></div></div>
</div>
<div class="btns">
  <button class="btn food"  onclick="feed()">+----------+
| (>w<)    |
|          |
| alimentar|
+----------+</button>
  <button class="btn fun"   onclick="play()">+----------+
| (^o^)    |
|          |
| jugar    |
+----------+</button>
  <button class="btn love"  onclick="pet()">+----------+
| (*^.^*)  |
|          |
| acariciar|
+----------+</button>
  <button class="btn sleep" onclick="doSleep()">+----------+
| (-_-)    |
|          |
| dormir   |
+----------+</button>
</div>
<div style="font-size:7px;color:#888888;letter-spacing:3px;width:1100px;margin-top:6px;margin-bottom:2px;padding-top:6px;border-top:1px solid #1a1a1a;">* MISIFU * — gato atigrado, ojos cafes</div>
<div class="btns misifu-btns" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:1100px;margin-top:4px;">
  <button class="btn food"  onclick="mfeed()"  style="color:#886633;">+----------+
|(#>w<#)   |
|          |
| alimentar|
+----------+</button>
  <button class="btn fun"   onclick="mplay()"  style="color:#886633;">+----------+
|(#^o^#)   |
|          |
| jugar    |
+----------+</button>
  <button class="btn love"  onclick="mpet()"   style="color:#886633;">+----------+
|(#*.*#)   |
|          |
| acariciar|
+----------+</button>
  <button class="btn sleep" onclick="mdoSleep()" style="color:#886633;">+----------+
|(#-_-#)   |

| dormir   |

</div>
<div class="msgarea" id="mmsg" style="color:#886633;">Misifu: mrrow~ :3</div>

<script>
const W=1300, H=750;
let worldX=0; // horizontal scroll offset for background
const bg  = document.getElementById('bgcanvas').getContext('2d');
const ctx = document.getElementById('canvas').getContext('2d');
const cvs = document.getElementById('canvas');

const S={food:70,fun:60,love:80,sleep:50,sleeping:false};
let currentFloor = 0; // 0=piso1, 1=segundo

// ── FISICA ──
const FLOOR = H - 68;
const GRAV=0.55, BOUNCE=0.52, FRIC=0.995;
let cat={x:160,y:FLOOR,vx:2.8,vy:-6,onFloor:false,dragging:false};

// ── SPRITES ──
const SP={
  walk0:["  /\\_/\\ ","  ( ^w^ )","  >(   )<","   v   v "],
  walk1:["  /\\_/\\ ","  ( ^w^ )","  (   )< ","   v   v "],
  sit:  ["  /\\_/\\ ","  (=^.^=)","  (   )  ","   n   n "],
  love: ["  /\\_/\\ "," (*^o^*) ","  (   )  ","   n   n "],
  play: ["  /\\_/\\ ","  ( >w< )","  >(   )<","   v   v "],
  pet:  ["  /\\_/\\ "," (*^.^*) ","  (   )  ","   n   n "],
  sad:  ["  /\\_/\\ ","  ( ;_; )","  (   )  ","   n   n "],
  slp0: ["  /\\_/\\ ","  (-_-)z ","  (   )  ","   n   n "],
  slp1: ["  /\\_/\\ ","  (-_-)Z ","  (   )  ","   n   n "],
  grab: ["  /\\_/\\ ","  ( o.O )","  >(   )<","   ~ ~   "],
  hung: ["  /\\_/\\ ","  ( o.o )","  (   )  ","   n   n "],
};
const CH_W=8.4, LH=15;
let curSp='walk0', forceSp=null, forceMs=0;
let walkF=0, walkT=0, sleepB=0, sitT=0;

// ── DIA/NOCHE hora local ──
function getT(){ const d=new Date(); return (d.getHours()*3600+d.getMinutes()*60+d.getSeconds())/86400; }
function lerp(a,b,p){return a+(b-a)*p;}
function skyRGB(t){
  let r,g,b;
  if(t<0.25){const p=t/0.25;r=lerp(5,220,p);g=lerp(5,120,p);b=lerp(20,60,p);}
  else if(t<0.5){const p=(t-.25)/.25;r=lerp(220,100,p);g=lerp(120,180,p);b=lerp(60,220,p);}
  else if(t<0.75){const p=(t-.5)/.25;r=lerp(100,240,p);g=lerp(180,100,p);b=lerp(220,50,p);}
  else{const p=(t-.75)/.25;r=lerp(240,5,p);g=lerp(100,5,p);b=lerp(50,20,p);}
  return{r:Math.round(r),g:Math.round(g),b:Math.round(b)};
}

// ─────────────────────────────────────────
// PISO 1
// (según plano: ventana grande izq, cuadro, plantas con alfombra, ventana der, cama, rack/tv)
// ─────────────────────────────────────────
function drawFloor1(isNight, sky){
  const c=bg;
  c.textBaseline='top';
  const RW = W*3; // room is 3x wide for scrolling

  // ── PARED fondo — ASCII dots ──
  const ceilH = 28;
  const floorTop = FLOOR;
  c.font='11px monospace'; c.textBaseline='top';
  c.fillStyle = isNight ? '#0a0a1a' : '#111120';
  c.fillRect(-W, 0, RW+W*2, H);

  // ── TECHO — ASCII bricks ──
  c.font='11px monospace';
  const ceilBrick1 = isNight ? '#3a2a10' : '#4a3518';
  const ceilBrick2 = isNight ? '#2a1a08' : '#3a2808';
  for(let bx=-W; bx<RW+W; bx+=22){
    c.fillStyle = ((Math.floor(bx/22))%2===0) ? ceilBrick1 : ceilBrick2;
    c.fillText('=', bx, 2);
    c.fillText('=', bx, 12);
  }
  // molding ASCII line
  c.fillStyle='#cc9944';
  for(let bx=-W; bx<RW+W; bx+=8) c.fillText('-', bx, ceilH-4);
  c.fillStyle='#aa7733';
  for(let bx=-W; bx<RW+W; bx+=8) c.fillText('_', bx, ceilH+1);

  // ── PISO — ASCII tablones ──
  const boardPat = ['=','=','=','-','=','=','=','-'];
  c.font='11px monospace';
  for(let row=0; row<Math.ceil((H-floorTop)/13); row++){
    const y2 = floorTop + row*13;
    c.fillStyle = row%2===0 ? '#4a2810' : '#3a2008';
    let bx = -W + ((row%2)*55);
    while(bx < RW+W){
      c.fillText('_', bx, y2);
      bx += 8;
    }
  }
  // baseboard ASCII
  c.fillStyle='#6a3a18';
  for(let bx=-W; bx<RW+W; bx+=8) c.fillText('_', bx, floorTop);

  // ── PARED DOT PATTERN ──
  c.fillStyle = isNight ? '#ffffff18' : '#ffffff10';
  c.font='11px monospace'; c.textBaseline='top';
  for(let y2=ceilH+10; y2<floorTop-6; y2+=22)
    for(let x2=(y2%44===0?-W:-W+11); x2<RW+W; x2+=22) c.fillText('.',x2,y2);

  // ══════════════════════════════════════
  // MUEBLES — layout from left to right
  // Room total width ~2600px (W*2), scrollable
  // ══════════════════════════════════════

  // ── [x≈-160] BOOKSHELF izquierda extrema ──
  drawBookshelf(c, -180, floorTop);

  // ── [x≈20] CAMA + MESITA ──
  drawBed(c, 20, floorTop-88);
  drawNightstand(c, 220, floorTop-62);

  // ── [x≈30] VENTANA IZQUIERDA ──
  drawBigWindow(c, 20, floorTop-390, isNight, sky);

  // ── [x≈320] LAMPARA COLGANTE ──
  drawHangingLamp(c, 340, ceilH, isNight);

  // ── [x≈380] PLANTAS ──
  drawPlant(c, 390, floorTop-72, 'tall');
  drawPlant(c, 450, floorTop-56, 'small');

  // ── [x≈430] CUADRO centro-izq ──
  drawPicture(c, 430, floorTop-480, 'luna');

  // ── [x≈520] ALFOMBRA grande ──
  drawEllipseRug(c, 600, floorTop+8);

  // ── [x≈560] SOFA ──
  drawSofa(c, 530, floorTop-78);

  // ── [x≈700] MESA DE CENTRO ──
  drawCoffeeTable(c, 660, floorTop-30);

  // ── [x≈740] VENTANA DERECHA ──
  drawBigWindow(c, 740, floorTop-390, isNight, sky);

  // ── [x≈760] COJIN/POUFFE ──
  drawPouffe(c, 760, floorTop-48);

  // ── [x≈900] LAMPARA COLGANTE derecha ──
  drawHangingLamp(c, 920, ceilH, isNight);

  // ── [x≈960] TV + RACK ──
  drawRack(c, 940, floorTop-90);

  // ── [x≈1080] LAMPARA DE PIE ──
  drawFloorLamp(c, 1110, floorTop, isNight);

  // ── [x≈1150] VENTANA extra derecha ──
  drawBigWindow(c, 1160, floorTop-390, isNight, sky);

  // ── [x≈1200] CUADRO derecho ──
  drawPicture(c, 1220, floorTop-480, 'misifu');

  // ── [x≈1350] ESCRITORIO ──
  drawDesk(c, 1340, floorTop);

  // ── [x≈1500] LAMPARA COLGANTE far right ──
  drawHangingLamp(c, 1520, ceilH, isNight);

  // ── [x≈1550] ESPEJO ──
  drawMirror(c, 1560, floorTop-350, isNight);

  // ── [x≈1650] PLANTA GRANDE ──
  drawPlant(c, 1650, floorTop-72, 'tall');
  drawPlant(c, 1710, floorTop-56, 'small');

  // ── [x≈1720] PUERTA AL PATIO ──
  drawPatioDoor(c, 1750, floorTop-160, isNight, sky);

  // ── [x≈1900] ESTANTE LIBROS ──
  drawBookshelf(c, 1900, floorTop);

  // ── [x≈2050] SILLON ──
  drawArmchair(c, 2050, floorTop-72);

  // ── [x≈2200] ALFOMBRA 2 ──
  drawEllipseRug(c, 2200, floorTop+8);

  // techo molding ASCII on top of everything
  c.fillStyle='#cc9944';
  c.font='11px monospace';
  for(let bx=-W; bx<RW+W; bx+=8) c.fillText('-', bx, ceilH-4);
}

// ── NEW FURNITURE ──

function drawSofa(c,x,y){
  const lines=[
    '  _____________________  ',
    ' |_____________________| ',
    ' | [=====] [=========] | ',
    ' | |     | |         | | ',
    ' | |_____| |_________| | ',
    ' |_____________________| ',
    '   ||               ||   ',
    '   ++_______________++   ',
  ];
  c.font='11px monospace';
  lines.forEach((l,i)=>{ c.fillStyle=i<2?'#7a3a20':(i===6||i===7)?'#4a2010':'#6a3018'; c.fillText(l,x,y+i*12); });
}

function drawCoffeeTable(c,x,y){
  const lines=[
    ' ___________',
    '|___________|',
    ' ||       || ',
    ' ||       || ',
    '  =========  ',
  ];
  c.font='11px monospace';
  lines.forEach((l,i)=>{ c.fillStyle=i<2?'#8B6040':(i===4)?'#6a4020':'#5a3010'; c.fillText(l,x,y+i*11); });
}

function drawDesk(c,x,y){
  const lines=[
    ' [~] [book]  ',
    '+===========+',
    '|           |',
    '+===========+',
    ' ||       || ',
    '_||_______||_',
  ];
  c.font='11px monospace';
  lines.forEach((l,i)=>{ c.fillStyle=i===0?'#88aacc':(i===1||i===3)?'#8B6040':(i>=4)?'#5a3010':'#7a5030'; c.fillText(l,x,y-lines.length*11+i*11); });
  // monitor
  const monLines=[
    '+----------+',
    '| .  .  . |',
    '|  ~~~~~~  |',
    '+----------+',
    '    |||||   ',
    '  _______   ',
  ];
  c.font='10px monospace';
  monLines.forEach((l,i)=>{ c.fillStyle=i===0||i===3?'#334455':(i>=4)?'#4a3010':(i===1)?'#88aaee':'#224466'; c.fillText(l,x+10,y-lines.length*11-monLines.length*11+i*11); });
}

function drawFloorLamp(c,x,y,isNight){
  const lines=['  /\\  ','  ||  ','  ||  ','  ||  ',' /  \\ ','/____\\'];
  c.font='12px monospace';
  const top=y-lines.length*13-10;
  lines.forEach((l,i)=>{
    c.fillStyle=(i===0&&isNight)?'#ffdd66':(i===0)?'#443322':'#8B5A2B';
    c.fillText(l,x,top+i*13);
  });
  if(isNight){
    c.fillStyle='rgba(255,220,60,0.20)';
    const glowRows=[' . . . ',' .   . ','. . . .',' .   . ',' . . . '];
    glowRows.forEach((gr,i)=>c.fillText(gr, x-10, top+i*12-10));
  }
}

function drawBookshelf(c,x,y){
  const lines=[
    '+===========+',
    '|[##][##][#]|',
    '|[#][###][##]|',
    '+===========+',
    '|[##][#][###]|',
    '|[###][##][#]|',
    '+===========+',
    ' ||        ||',
  ];
  const colors=['#5a3010','#cc4422','#2244aa','#22aa44','#aa8822','#884422','#5a3010','#3a1a08'];
  c.font='10px monospace';
  lines.forEach((l,i)=>{ c.fillStyle=colors[i]||'#5a3010'; c.fillText(l,x,y-lines.length*12+i*12); });
}

function drawMirror(c,x,y,isNight){
  const lines=[
    '+----------+',
    '|  /\\_/\\   |',
    '| (  ^  )  |',
    '|  reflection|',
    '|  ~~~~~~  |',
    '+----------+',
    '    ||||    ',
    '  [______]  ',
  ];
  c.font='11px monospace';
  lines.forEach((l,i)=>{
    c.fillStyle=(i===0||i===5)?'#aaaaaa':(i>=6)?'#8B6040':(i===1||i===2)?'#ccccaa':'#888888';
    c.fillText(l,x,y+i*14);
  });
  // shimmer ASCII
  if(isNight){
    c.fillStyle='#ffffff22';
    c.fillText('   *   *   ', x+2, y+18);
    c.fillText('  .   .  ', x+2, y+32);
  }
}

function drawArmchair(c,x,y){
  const lines=[
    ' /~~~~~~~\\ ',
    '|  _____  |',
    '| |     | |',
    '| |_____| |',
    ' \\~~~~~~~/ ',
    '  ||   ||  ',
    '  ++   ++  ',
  ];
  c.font='11px monospace';
  lines.forEach((l,i)=>{ c.fillStyle=i<1?'#6a3050':(i===5||i===6)?'#3a1a08':'#5a2840'; c.fillText(l,x,y+i*12); });
}

function drawBigWindow(c,x,y,isNight,sky){
  // ventana CUADRADA 100% ASCII — ~280px x 280px
  c.font='12px monospace';
  // interior cielo ASCII — 19 filas
  const interior = isNight
    ? '. * . * . * . * . * . * . * . * . * .'
    : '~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~';
  for(let i=0;i<19;i++){
    c.fillStyle = isNight
      ? (i%2===0 ? '#aabbcc' : '#8899bb')
      : (i%2===0 ? '#88aacc' : '#6699bb');
    c.fillText(interior, x+8, y+14+i*14);
  }
  // marco cuadrado con cruceta horizontal a mitad
  const W1='+'+'-'.repeat(38)+'+';
  const M1='|'+' '.repeat(38)+'|';
  const D1='+'+'-'.repeat(18)+'+'+'-'.repeat(19)+'+';
  const frame=[W1,M1,M1,M1,M1,M1,M1,M1,M1,D1,M1,M1,M1,M1,M1,M1,M1,M1,M1,W1];
  frame.forEach((l,i)=>{
    c.fillStyle=(i===0||i===9||i===19)?'#cc9944':'#8B5A2B';
    c.fillText(l, x, y+i*14);
  });
}

function drawPicture(c,x,y,who){
  const lines = who==='misifu' ? [
    '+------------------------+',
    '| /\\_/\\                  |',
    '|(#=^.^=#)  ~Misifu~     |',
    '|   n  n                 |',
    '|   . . . . . . . . .    |',
    '+------------------------+',
  ] : [
    '+------------------------+',
    '|    /\\_/\\               |',
    '|   ( ^.^ )   ~Luna~     |',
    '|     n  n               |',
    '|   . . . . . . . . .    |',
    '+------------------------+',
  ];
  c.font='12px monospace';
  lines.forEach((l,i)=>{
    c.fillStyle=(i===0||i===5)?'#aa7733':(who==='misifu'&&i===2)?'#c89850':'#e8c888';
    c.fillText(l,x,y+i*14);
  });
}

function drawBed(c,x,y){
  const lines=[
    '  ___________________',
    ' /####################\\',
    '|######################|',
    '|======================|',
    '|______________________|',
    '||                    ||',
    '++____________________++',
  ];
  c.font='11px monospace';
  lines.forEach((l,i)=>{
    c.fillStyle=(i<3)?'#6a3a2a':(i<5)?'#8B4513':'#5a2e10';
    c.fillText(l,x,y+i*12);
  });
}

function drawRug(c,x,y){
  const lines=[
    '  (~~~~~~~~~~~~~~~~~~~~~~~~~~~)',
    ' ( *  ~  *  ~  *  ~  *  ~  * )',
    '(   ~  *  ~  *  ~  *  ~  *   )',
    ' ( *  ~  *  ~  *  ~  *  ~  * )',
    '  (~~~~~~~~~~~~~~~~~~~~~~~~~~~)',
  ];
  c.font='11px monospace';
  lines.forEach((l,i)=>{ c.fillStyle='#5a2a6a77'; c.fillText(l,x,y+i*11); });
}

function drawPlant(c,x,y,size){
  if(size==='tall'){
    const lines=[
      '  ( )',
      ' (   )',
      '(     )',
      '  |||  ',
      '  |||  ',
      ' _|||_ ',
      '|_____|',
    ];
    c.font='12px monospace';
    lines.forEach((l,i)=>{ c.fillStyle=i<3?'#2a6a2a':(i<5?'#4a3010':'#6a4010'); c.fillText(l,x,y+i*13); });
  } else {
    const lines=[
      ' (o) ',
      '(   )',
      ' ||| ',
      '_|_|_',
    ];
    c.font='12px monospace';
    lines.forEach((l,i)=>{ c.fillStyle=i<2?'#3a7a3a':(i<3?'#4a3010':'#6a4010'); c.fillText(l,x,y+i*13); });
  }
}

function drawRack(c,x,y){
  const lines=[
    ' _________________________ ',

function drawFloor2(isNight, sky){
  const c=bg;

  // fondo pared ASCII puntos
  c.fillStyle='#000000'; c.fillRect(0,0,W,H);
  c.fillStyle = isNight ? '#ffffff18' : '#ffffff10';
  for(let y2=28; y2<FLOOR; y2+=22)
    for(let x2=(y2%44===0?0:11); x2<W; x2+=22) c.fillText('.',x2,y2);

  // techo ASCII
  c.font='11px monospace';
  const cBrick1 = isNight ? '#3a2a10' : '#4a3518';
  const cBrick2 = isNight ? '#2a1a08' : '#3a2808';
  for(let bx=0; bx<W; bx+=22){
    c.fillStyle = ((Math.floor(bx/22))%2===0) ? cBrick1 : cBrick2;
    c.fillText('=', bx, 2);
    c.fillText('=', bx, 12);
  }
  c.fillStyle='#cc9944';
  for(let bx=0; bx<W; bx+=8) c.fillText('-', bx, 24);

  // piso ASCII tablones
  for(let row=0; row<Math.ceil((H-FLOOR)/13); row++){
    const y2 = FLOOR + row*13;
    c.fillStyle = row%2===0 ? '#3a1e08' : '#2e1606';
    let bx = (row%2)*55;
    while(bx<W){ c.fillText('_', bx, y2); bx+=8; }
  }
  c.fillStyle='#6a3a18';
  for(let bx=0; bx<W; bx+=8) c.fillText('_', bx, FLOOR);

  // cartel "segundo piso"
  c.fillStyle='#aa7733'; c.font='bold 9px monospace';

  // ── SILLON ──
  drawSofa(c, 310, FLOOR-70);

  // ── VENTANA derecha ──
  drawBigWindow(c, 580, 38, isNight, sky);

  // ── PUERTA EXIT derecha ──
  drawDoor(c, 1010, FLOOR-150, isNight, sky);

function drawDoor(c,x,y,isNight,sky){

  });

  c.fillText('/    \\',   x+6, y+91);

  c.fillText('~^~^~^~',  x+4, y+101);
  // marco puerta
  c.fillStyle='#8B5A2B'; c.font='bold 12px monospace';
  const dlines=[
    '+--------+',
    '|        |',
    '|        |',
    '|        |',
    '|        |',
    '|        |',
    '|        |',
    '|        |',

    '|  >>>   |',
    '|        |',
    '|   o    |',

  ];

// ── DRAG ──
let isDrag=false,dragOx=0,dragOy=0;
let lunaVHist=[], lunaLmx=0, lunaLmy=0, lunaLt=0;
function startDrag(mx,my){
  const cx=cat.x+40,cy=cat.y-30;
  if(Math.abs(mx-cx)<52&&Math.abs(my-cy)<44){
    isDrag=true;cat.dragging=true;dragOx=mx-cat.x;dragOy=my-cat.y;
    cat.vx=0;cat.vy=0;lunaLmx=mx;lunaLmy=my;lunaLt=performance.now();lunaVHist=[];
    cvs.classList.add('grabbing');setForce('grab',99999);showBubble('!!! o.O');
  }
}
function moveDrag(mx,my){
  if(isDrag){
    cat.x=mx-dragOx;cat.y=my-dragOy;
    const now=performance.now(), dt=now-lunaLt;
    lunaVHist.push({vx:(mx-lunaLmx)/Math.max(dt,1)*16, vy:(my-lunaLmy)/Math.max(dt,1)*16, t:now});
    if(lunaVHist.length>6) lunaVHist.shift();
    lunaLmx=mx;lunaLmy=my;lunaLt=now;
  }
}
function endDrag(){
  if(isDrag){
    isDrag=false;cat.dragging=false;cvs.classList.remove('grabbing');forceSp=null;
    const recent=lunaVHist.filter(v=>performance.now()-v.t<80);
    if(recent.length>0){
      cat.vx=recent.reduce((s,v)=>s+v.vx,0)/recent.length;
      cat.vy=recent.reduce((s,v)=>s+v.vy,0)/recent.length;
    } else { cat.vx=0;cat.vy=0; }
    showBubble('miau!!');
  }
}

cvs.addEventListener('mousemove',e=>{const r=cvs.getBoundingClientRect();moveDrag(e.clientX-r.left,e.clientY-r.top);});
cvs.addEventListener('mouseup',endDrag);
cvs.addEventListener('mouseleave',endDrag);

// ── SPRITES ──
function setForce(s,ms){forceSp=s;forceMs=ms;}
function updateSprite(dt){
  if(forceSp){curSp=forceSp;forceMs-=dt;if(forceMs<=0)forceSp=null;return;}
  if(S.sleeping){sleepB+=dt;curSp=sleepB>900?'slp1':'slp0';if(sleepB>1800)sleepB=0;return;}
  const mn=Math.min(S.food,S.fun,S.love,S.sleep);
  if(mn<15){curSp='sad';return;} if(S.food<20){curSp='hung';return;}
  if(!cat.onFloor){curSp=cat.vy<0?'play':'sit';}
  else if(Math.abs(cat.vx)>0.5){
    walkT+=dt;if(walkT>80){walkT=0;walkF=1-walkF;}
    curSp=walkF?'walk1':'walk0';
  } else curSp='sit';
}

// ── PHYSICS ──
function updatePhysics(dt){
  if(cat.dragging)return;
  cat.vy+=GRAV;cat.x+=cat.vx;cat.y+=cat.vy;
  if(cat.y>=FLOOR){cat.y=FLOOR;cat.vy*=-BOUNCE;cat.onFloor=true;if(Math.abs(cat.vy)<0.8)cat.vy=0;}
  else cat.onFloor=false;
  if(cat.x<4){cat.x=4;cat.vx=Math.abs(cat.vx)*0.85;}
  if(cat.x>W-90){cat.x=W-90;cat.vx=-Math.abs(cat.vx)*0.85;}
  if(cat.y<30){cat.y=30;cat.vy=Math.abs(cat.vy)*0.4;}
  if(cat.onFloor&&!forceSp&&!S.sleeping){
    // always walk — maintain minimum speed
    if(cat.onFloor){
      const minSpd=2.0;
      if(Math.abs(cat.vx)<minSpd) cat.vx = cat.vx>=0 ? minSpd : -minSpd;
      // random jump
      sitT+=dt;
      if(sitT>700+Math.random()*600){
        sitT=0;
        if(Math.random()<0.55){ cat.vy=-(8+Math.random()*5); }
      }
    }
  }
}

let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(ts-last,50);last=ts;
  drawBG();updatePhysics(dt);updateSprite(dt);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath();ctx.ellipse(cat.x+44,FLOOR+3,26,5,0,0,Math.PI*2);ctx.fill();
  drawCat(curSp,cat.x,cat.y-56,cat.vx<-0.4&&!cat.dragging);
  if(cat.dragging){ctx.strokeStyle='#ffffff33';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.strokeRect(cat.x+2,cat.y-58,84,62);ctx.setLineDash([]);}
}
requestAnimationFrame(loop);

  } else mcurSp='sit';
}
function updateMPhysics(dt){
  if(mcat.dragging)return;
  mcat.vy+=GRAV;mcat.x+=mcat.vx;mcat.y+=mcat.vy;
  if(mcat.y>=FLOOR){mcat.y=FLOOR;mcat.vy*=-BOUNCE;mcat.onFloor=true;if(Math.abs(mcat.vy)<0.8)mcat.vy=0;}
  else mcat.onFloor=false;
  if(mcat.x<4){mcat.x=4;mcat.vx=Math.abs(mcat.vx)*0.85;}
  if(mcat.x>W-90){mcat.x=W-90;mcat.vx=-Math.abs(mcat.vx)*0.85;}
  if(mcat.y<30){mcat.y=30;mcat.vy=Math.abs(mcat.vy)*0.4;}
  if(mcat.onFloor&&!mforceSp&&!SM.sleeping){
    // always walk — maintain minimum speed
    if(mcat.onFloor){
      const mminSpd=2.2;
      if(Math.abs(mcat.vx)<mminSpd) mcat.vx = mcat.vx>=0 ? mminSpd : -mminSpd;
      // random jump (misifu jumps more)
      msitT+=dt;
      if(msitT>500+Math.random()*500){
        msitT=0;
        if(Math.random()<0.65){ mcat.vy=-(9+Math.random()*6); }
      }
    }
  }
}
function drawMisifu(sp,x,y,flip){
  const lines=MSP[sp];
  ctx.save();ctx.font='13px monospace';ctx.textBaseline='top';
  ctx.fillStyle='#c89850'; // atigrado dorado
  const sw=lines[0].length*CH_W;
  if(flip){ctx.translate(x+sw,y);ctx.scale(-1,1);ctx.translate(-x,-y);}
  // rayas del tigre — sobreponer lineas con color distinto
  lines.forEach((l,i)=>{
    ctx.fillStyle='#c89850';

    if(i===1){

      if(eyeL>=0&&eyeL!==eyeR){
        ctx.fillText('o',x+eyeL*CH_W,y+i*LH);
        ctx.fillText('o',x+eyeR*CH_W,y+i*LH);
      }
    }
  });
  ctx.restore();
}

// patch loop to also draw misifu — override requestAnimationFrame loop
// we do this by monkey-patching the loop var isn't accessible, so we hook into ctx.clearRect
const _origClear = ctx.clearRect.bind(ctx);
ctx.clearRect = function(x,y,w,h){
  _origClear(x,y,w,h);
  // update misifu
  updateMPhysics(16);
  updateMSprite(16);
};
// also hook drawCat post-render by patching ctx.fillText indirectly — easier: extend loop
// Actually cleanest: schedule misifu draw each frame alongside Luna
const _origLoop = loop;
function misifuDraw(){
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath();ctx.ellipse(mcat.x+44,FLOOR+3,26,5,0,0,Math.PI*2);ctx.fill();
  drawMisifu(mcurSp,mcat.x,mcat.y-56,mcat.vx<-0.4&&!mcat.dragging);
  if(mcat.dragging){ctx.strokeStyle='#c8985066';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.strokeRect(mcat.x+2,mcat.y-58,84,62);ctx.setLineDash([]);}
}
// We need to inject into the animation loop. The loop calls ctx.clearRect each frame.
// Cleanest: after ctx.clearRect, drawMisifu is called via the hook above.
// But timing for updateMPhysics needs dt. Let's use a simpler approach:
// override the whole loop
cancelAnimationFrame(window._rafId);
let mlast=0;
function newLoop(ts){
  window._rafId = requestAnimationFrame(newLoop);
  const dt=Math.min(ts-last,50); last=ts;
  const mdt=Math.min(ts-mlast,50); mlast=ts;
  drawBG();
  updatePhysics(dt); updateSprite(dt);
  updateMPhysics(mdt); updateMSprite(mdt);
  _origClear(0,0,W,H);
  // Luna shadow + draw
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath();ctx.ellipse(cat.x+44,FLOOR+3,26,5,0,0,Math.PI*2);ctx.fill();
  drawCat(curSp,cat.x,cat.y-56,cat.vx<-0.4&&!cat.dragging);
  if(cat.dragging){ctx.strokeStyle='#ffffff33';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.strokeRect(cat.x+2,cat.y-58,84,62);ctx.setLineDash([]);}
  // Misifu shadow + draw
  misifuDraw();
}
ctx.clearRect = _origClear; // restore
window._rafId = requestAnimationFrame(newLoop);

// ── PATIO ──
const PATIO_DOOR_X = 1750;
const PATIO_DOOR_W = 110;
const PATIO_DOOR_Y = FLOOR - 160;
const PATIO_DOOR_H = 160;

// DAY CYCLE: 10 real minutes = full day
const DAY_MS = 10 * 60 * 1000;

let patioOpen = false;
let patioRAF = null;
const pc = () => document.getElementById('patio-canvas').getContext('2d');

// patio cats
const PC1 = {x:200, y:0, vx:1.4, sp:'walk0', frame:0, ft:0, name:'luna'};
const PC2 = {x:900, y:0, vx:-1.2, sp:'walk0', frame:0, ft:0, name:'misifu'};
const PW = 1300, PH = 750;
const PGRASS = 580; // y of grass line
const PCAT_FLOOR = PGRASS - 2;

function patioT(){
  // 0..1 based on 10-min cycle from page load
  return (performance.now() % DAY_MS) / DAY_MS;
}
function patioIsNight(t){ return t < 0.25 || t > 0.75; }

function patioSkyColor(t){
  // blue sky gradient: dawn(0.25)→day(0.5)→dusk(0.75)→night
  let r,g,b;
  if(t<0.25){const p=t/0.25;r=lerp(5,30,p);g=lerp(5,60,p);b=lerp(20,120,p);}
  else if(t<0.5){const p=(t-.25)/.25;r=lerp(30,80,p);g=lerp(60,160,p);b=lerp(120,220,p);}
  else if(t<0.75){const p=(t-.5)/.25;r=lerp(80,30,p);g=lerp(160,60,p);b=lerp(220,120,p);}
  else{const p=(t-.75)/.25;r=lerp(30,5,p);g=lerp(60,5,p);b=lerp(120,20,p);}
  return{r:Math.round(r),g:Math.round(g),b:Math.round(b)};
}

function drawPatioFrame(){
  const c = pc();
  const t = patioT();
  const isNight = patioIsNight(t);
  const {r,g,b} = patioSkyColor(t);
  c.font = '13px monospace'; c.textBaseline = 'top';

  // ── SKY background ──
  c.fillStyle = `rgb(${r},${g},${b})`;
  c.fillRect(0, 0, PW, PGRASS);

  // ── GRASS background ──
  c.fillStyle = '#1a4a0a';
  c.fillRect(0, PGRASS, PW, PH - PGRASS);

  // ── STARS (night) ──
  if(isNight){
    const stars = [
      [80,40],[200,70],[350,30],[500,55],[650,20],[800,45],[950,35],[1100,60],[1200,25],
      [150,110],[400,90],[600,100],[850,80],[1050,115],[1250,95],[50,140],[320,160],
      [700,130],[1000,145],[1180,155],[470,175],[230,190],[760,180],[1120,170],
    ];
    stars.forEach(([sx,sy],i)=>{
      const twinkle = Math.sin(performance.now()/400 + i*1.3) > 0.3;
      c.fillStyle = twinkle ? '#ffffee' : '#aabbcc';
      c.fillText(twinkle?'*':'.', sx, sy);
    });
    // LUNA ASCII
    const moonX = 900 + Math.sin(t*Math.PI*2)*300;
    const moonY = 80 + Math.cos(t*Math.PI*2)*40;
    c.fillStyle='#ffffaa';
    c.font='14px monospace';
    c.fillText('( )',  moonX, moonY);
    c.fillText("'~'", moonX+2, moonY+14);
    c.font='13px monospace';
  } else {
    // SOL ASCII — arches across the sky
    const sunProgress = (t - 0.25) / 0.5; // 0=dawn, 1=dusk
    const sunX = Math.round(100 + sunProgress * 1100);
    const sunY = Math.round(200 - Math.sin(sunProgress * Math.PI) * 160);
    c.fillStyle='#ffee44';
    c.font='14px monospace';
    c.fillText(' \\|/ ', sunX-20, sunY-14);
    c.fillText('-(o)-', sunX-20, sunY);
    c.fillText(' /|\\ ', sunX-20, sunY+14);
    c.font='13px monospace';
    // nubes ASCII
    const cloudOff = (performance.now()/8000) % PW;
    const clouds = [
      {x:100, y:80,  s:'(~~~)'},
      {x:400, y:55,  s:'(~~~~~)'},
      {x:700, y:95,  s:'(~~~~)'},
      {x:1050,y:65,  s:'(~~~~~~)'},
    ];
    c.fillStyle = '#cce8ff';
    clouds.forEach(cl=>{
      const cx = ((cl.x + cloudOff) % (PW+200)) - 100;
      c.fillText(cl.s, cx, cl.y);
    });
  }

  // ── ARBOLES ──
  const trees = [
    {x:100}, {x:280}, {x:550}, {x:820}, {x:1050}, {x:1220},
  ];
  trees.forEach((tr,i)=>{
    const tall = i%2===0;
    c.fillStyle='#2a7a1a';
    if(tall){
      c.fillText('  /\\  ', tr.x, PGRASS-95);
      c.fillText(' /  \\ ', tr.x, PGRASS-82);
      c.fillText('/    \\', tr.x, PGRASS-69);
    } else {
      c.fillText(' /\\  ', tr.x, PGRASS-70);
      c.fillText('/  \\ ', tr.x, PGRASS-57);
    }
    c.fillStyle='#5a3010';
    c.fillText('  ||  ', tr.x, PGRASS-44);
    c.fillText('  ||  ', tr.x, PGRASS-31);
  });

  // ── PASTO ASCII ──
  c.fillStyle='#3a8a1a';
  const grassLine = '~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~^~';
  c.fillText(grassLine, 0, PGRASS);
  c.fillStyle='#2a6a10';
  c.fillText(grassLine, 0, PGRASS+13);
  // flores
  c.fillStyle='#ffaa44';
  [180, 460, 680, 920, 1150].forEach(fx=>{
    c.fillText('*', fx, PGRASS-5);
  });
  c.fillStyle='#ff88aa';
  [320, 570, 780, 1060].forEach(fx=>{
    c.fillText('*', fx, PGRASS-5);
  });

  // ── MUEBLES PATIO ──
  // banco
  c.fillStyle='#8B6040';
  const bench = ['+---------------+','|  _   _   _    |','| | | | | | |   |','+---------------+','  ||         ||  '];
  bench.forEach((l,i)=>c.fillText(l, 480, PGRASS-bench.length*13+i*13));
  // maceta
  c.fillStyle='#aa6633';
  const pot = ['  (o)  ',' /   \\ ','|     |','|_____|','/_____\\'];
  pot.forEach((l,i)=>c.fillText(l, 370, PGRASS-pot.length*13+i*13));
  c.fillStyle='#2a8a2a';
  c.fillText(' |||  ', 374, PGRASS-pot.length*13-13);
  c.fillText('(   ) ', 372, PGRASS-pot.length*13-26);
  // fuente
  c.fillStyle='#6688aa';
  const fountain = ['  (~~~)  ',' (  o  ) ','  (~~~)  ','  |||||  ',' /     \\ ','/_______\\'];
  fountain.forEach((l,i)=>c.fillText(l, 760, PGRASS-fountain.length*13+i*13));

  // ── GATO LUNA ──
  updatePatioCat(PC1, 16);
  drawPatioCat(c, PC1);

  // ── GATO MISIFU ──
  updatePatioCat(PC2, 16);
  drawPatioCat(c, PC2);

  // ── LABEL noche/dia ──
  c.fillStyle = isNight ? '#8899bb88' : '#ffffff44';
  c.font='8px monospace';
  c.fillText(isNight ? '* noche *' : '~ dia ~', 10, 10);
  c.font='13px monospace';
}

function updatePatioCat(cat, dt){
  if(cat.dragging) return;
  cat.x += cat.vx;
  if(!cat.vy) cat.vy=0;
  cat.vy += 0.55;
  cat.y += cat.vy;
  if(cat.y >= PCAT_FLOOR){ cat.y=PCAT_FLOOR; cat.vy=0; cat.onFloor=true; }
  else cat.onFloor=false;
  if(cat.x < 30){ cat.x=30; cat.vx=Math.abs(cat.vx); }
  if(cat.x > PW-120){ cat.x=PW-120; cat.vx=-Math.abs(cat.vx); }
  // random jumps
  if(!cat._jt) cat._jt=0;
  cat._jt+=dt;
  if(cat.onFloor && cat._jt > 1500+Math.random()*3000){ cat._jt=0; cat.vy=-(9+Math.random()*5); }
  // mouse chance: 40% — assigned once on open, reset on re-enter
  if(cat.hasMouse===undefined) cat.hasMouse = Math.random()<0.4;
  // sprite
  cat.ft+=dt; if(cat.ft>120){cat.ft=0;cat.frame=1-cat.frame;}
  cat.sp = cat.frame?'walk1':'walk0';
}

function drawPatioCat(c, cat){
  const isMisifu = cat.name==='misifu';
  // use correct sprite set
  const spSet = isMisifu ? MSP : SP;
  const sp = spSet[cat.sp];
  c.save();
  c.font='13px monospace'; c.textBaseline='top';
  c.fillStyle = isMisifu ? '#c89850' : '#ffffff';
  const sw = sp[0].length * CH_W;
  const flip = cat.vx < 0;
  const drawX = cat.x;
  const drawY = cat.y - 56;
  if(flip){ c.translate(drawX+sw, drawY); c.scale(-1,1); c.translate(-drawX, -drawY); }
  if(isMisifu){
    sp.forEach((l,i)=>{
      c.fillStyle='#c89850';
      c.fillText(l, drawX, drawY+i*LH);
      if(i===1){
        c.fillStyle='#8B4513';
        const eyeL=l.indexOf('o'), eyeR=l.lastIndexOf('o');
        if(eyeL>=0&&eyeL!==eyeR){ c.fillText('o',drawX+eyeL*CH_W,drawY+i*LH); c.fillText('o',drawX+eyeR*CH_W,drawY+i*LH); }
      }
    });
  } else {
    sp.forEach((l,i)=>c.fillText(l, drawX, drawY+i*LH));
  }
  // ratón en la boca
  if(cat.hasMouse){
    c.fillStyle = isMisifu ? '#c89850' : '#ffffff';
    c.fillText('~<:3', drawX + (flip?-30:sw-10), drawY+LH);
  }
  // drag highlight
  if(cat.dragging){
    c.strokeStyle='#ffffff44'; c.lineWidth=1; c.setLineDash([3,3]);
    c.strokeRect(drawX, drawY, 84, 62); c.setLineDash([]);
  }
  c.restore();
}

// ── PATIO DRAG ──
let pDrag=null, pDragOx=0, pDragOy=0, pVmx=0, pVmy=0, pLmx=0, pLmy=0;
const pcvs = ()=>document.getElementById('patio-canvas');

function patioHit(cat, mx, my){
  return Math.abs(mx-(cat.x+40))<52 && Math.abs(my-(cat.y-30))<44;
}

function setupPatioDrag(){
  const canvas = pcvs();
  canvas.addEventListener('mousedown', function(e){
    const r=canvas.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    for(const cat of [PC1,PC2]){
      if(patioHit(cat,mx,my)){
        pDrag=cat; cat.dragging=true; cat.vx=0; cat.vy=0;
        pDragOx=mx-cat.x; pDragOy=my-cat.y;
        pLmx=mx; pLmy=my; pVmx=0; pVmy=0;
        canvas.style.cursor='grabbing';
        return;
      }
    }
  });
  canvas.addEventListener('mousemove', function(e){
    const r=canvas.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    if(pDrag){ pDrag.x=mx-pDragOx; pDrag.y=my-pDragOy; pVmx=mx-pLmx; pVmy=my-pLmy; pLmx=mx; pLmy=my; return; }
    const hover = [PC1,PC2].some(cat=>patioHit(cat,mx,my));
    canvas.style.cursor = hover?'grab':'default';
  });
  function endPDrag(){
    if(pDrag){ pDrag.vx=pVmx*0.9||1.4; pDrag.vy=pVmy*0.9; pDrag.dragging=false; pDrag=null; pcvs().style.cursor='default'; }
  }
  canvas.addEventListener('mouseup', endPDrag);
  canvas.addEventListener('mouseleave', endPDrag);
  canvas.addEventListener('touchstart', function(e){
    e.preventDefault();
    const r=canvas.getBoundingClientRect(), t=e.touches[0];
    const mx=t.clientX-r.left, my=t.clientY-r.top;
    for(const cat of [PC1,PC2]){
      if(patioHit(cat,mx,my)){ pDrag=cat; cat.dragging=true; cat.vx=0; cat.vy=0; pDragOx=mx-cat.x; pDragOy=my-cat.y; pLmx=mx; pLmy=my; return; }
    }
  },{passive:false});
  canvas.addEventListener('touchmove', function(e){
    e.preventDefault();
    if(!pDrag) return;
    const r=canvas.getBoundingClientRect(), t=e.touches[0];
    const mx=t.clientX-r.left, my=t.clientY-r.top;
    pDrag.x=mx-pDragOx; pDrag.y=my-pDragOy; pVmx=mx-pLmx; pVmy=my-pLmy; pLmx=mx; pLmy=my;
  },{passive:false});
  canvas.addEventListener('touchend', endPDrag);
}

function patioLoop(){
  if(!patioOpen) return;
  drawPatioFrame();
  patioRAF = requestAnimationFrame(patioLoop);
}

function openPatio(){
  patioOpen = true;
  PC1.x=200; PC1.vx=1.4; PC1.vy=0; PC1.onFloor=true; PC1.hasMouse=Math.random()<0.4;
  PC2.x=900; PC2.vx=-1.2; PC2.vy=0; PC2.onFloor=true; PC2.hasMouse=Math.random()<0.4;
  document.getElementById('patio-overlay').style.display='block';
  setupPatioDrag();
  patioLoop();
}
function closePatio(){
  patioOpen = false;
  cancelAnimationFrame(patioRAF);
  document.getElementById('patio-overlay').style.display='none';
}

// detect click on patio door
cvs.addEventListener('click', function(e){
  const r=cvs.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const doorScreenX = PATIO_DOOR_X + worldX;
  if(mx>=doorScreenX && mx<=doorScreenX+PATIO_DOOR_W && my>=PATIO_DOOR_Y && my<=PATIO_DOOR_Y+PATIO_DOOR_H){
    openPatio();
  }
});

</script>
</body>
