<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ASCII CAT - Game</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#000000;
    display:flex;flex-direction:column;align-items:center;
    padding:20px 16px 40px;min-height:100vh;
    font-family:'Press Start 2P',monospace;color:#fff;
  }
  .title{font-size:12px;color:#888888;letter-spacing:4px;margin-bottom:6px;text-align:center;}
  .sub{font-size:8px;color:#555555;letter-spacing:2px;margin-bottom:14px;text-align:center;}

  #world{
    width:1300px;height:750px;
    position:relative;overflow:hidden;
    border:2px solid #222222;border-radius:4px;
    margin-bottom:14px;cursor:default;user-select:none;
  }
  #bgcanvas{position:absolute;inset:0;}
  #canvas{position:absolute;inset:0;cursor:grab;}
  #canvas.grabbing{cursor:grabbing;}

  #bubble{
    position:absolute;font-family:monospace;font-size:12px;color:#fff;
    background:#111;border:1px solid #444;border-radius:4px;
    padding:3px 8px;pointer-events:none;opacity:0;
    transition:opacity 0.25s;white-space:nowrap;z-index:20;
  }
  #bubble.show{opacity:1;}
  #clock{position:absolute;top:6px;right:8px;font-size:8px;color:#ffffff55;z-index:5;pointer-events:none;}

  .btns{width:1100px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .btn{
    background:#0a0a0a;border:1px solid #222;border-radius:4px;
    padding:10px;font-family:'Press Start 2P',monospace;
    font-size:7px;color:#aaaaaa;cursor:pointer;text-align:center;line-height:1.6;
    transition:color .15s, transform .1s, border-color .15s;
    white-space:pre;
  }
  .btn:active{transform:scale(.96);}
  .btn.food:hover{color:#ff9966; border-color:#ff9966;}
  .btn.fun:hover{color:#66ccff; border-color:#66ccff;}
  .btn.love:hover{color:#ff66aa; border-color:#ff66aa;}
  .btn.sleep:hover{color:#aa88ff; border-color:#aa88ff;}
  .msgarea{font-size:8px;color:#666666;margin-top:14px;min-height:14px;letter-spacing:1px;width:1100px;text-align:center;}
</style>
</head>
<body>
<div class="title">* <span id="cat-title-name">MI GATO</span> *</div>
<div class="sub">en memoria de mama &lt;3</div>

<div id="world">
  <canvas id="bgcanvas" width="1300" height="750"></canvas>
  <canvas id="canvas"   width="1300" height="750"></canvas>
  <div id="bubble"></div>
  <div id="clock"></div>
</div>

<div class="btns">
  <button class="btn food"  onclick="feed()">+----------+
| (>w<)    |
|          |
| alimentar|
+----------+</button>
  <button class="btn fun"   onclick="play()">+----------+
| (^o^)    |
|          |
| jugar    |
+----------+</button>
  <button class="btn love"  onclick="pet()">+----------+
| (*^.^*)  |
|          |
| acariciar|
+----------+</button>
  <button class="btn sleep" onclick="doSleep()">+----------+
| (-_-)    |
|          |
| dormir   |
+----------+</button>
</div>
<div class="msgarea" id="msg">miau~ :3</div>

<script>
const W=1300, H=750;

// Ancho exacto calculado para terminar inmediatamente después de las plantas del espejo
const HOUSE_WIDTH = 2000; 

// ── NOMBRE DEL GATO ──
const CAT_NAME = (window.prompt('¿Cuál es el nombre de tu gato?') || 'Mi Gato').trim() || 'Mi Gato';
document.getElementById('cat-title-name').textContent = CAT_NAME.toUpperCase();
document.title = CAT_NAME + ' - Tamagochi';
let worldX=0; 
const bg  = document.getElementById('bgcanvas').getContext('2d');
const ctx = document.getElementById('canvas').getContext('2d');
const cvs = document.getElementById('canvas');

const S={food:70,fun:60,love:80,sleep:50,sleeping:false};

// ── FISICA ──
const FLOOR = H - 68;
const GRAV=0.55, BOUNCE=0.52, FRIC=0.995;
let cat={x:160,y:FLOOR,vx:2.8,vy:-6,onFloor:false,dragging:false};

// ── SPRITES ──
const SP={
  walk0:["  /\\_/\\ ","  ( ^w^ )","  >(   )<","   v   v "],
  walk1:["  /\\_/\\ ","  ( ^w^ )","  (   )< ","   v   v "],
  sit:  ["  /\\_/\\ ","  (=^.^=)","  (   )  ","   n   n "],
  love: ["  /\\_/\\ "," (*^o^*) ","  (   )  ","   n   n "],
  play: ["  /\\_/\\ ","  ( >w< )","  >(   )<","   v   v "],
  pet:  ["  /\\_/\\ "," (*^.^*) ","  (   )  ","   n   n "],
  sad:  ["  /\\_/\\ ","  ( ;_; )","  (   )  ","   n   n "],
  slp0: ["  /\\_/\\ ","  (-_-)z ","  (   )  ","   n   n "],
  slp1: ["  /\\_/\\ ","  (-_-)Z ","  (   )  ","   n   n "],
  grab: ["  /\\_/\\ ","  ( o.O )","  >(   )<","   ~ ~   "],
  hung: ["  /\\_/\\ ","  ( o.o )","  (   )  ","   n   n "],
};
const CH_W=8.4, LH=15;
let curSp='walk0', forceSp=null, forceMs=0;
let walkF=0, walkT=0, sleepB=0, sitT=0;

// ── DIA/NOCHE hora local ──
const _gameStart = Date.now();
const GAME_DAY_MS = 24 * 60 * 1000; 
function getT(){ return ((Date.now() - _gameStart) % GAME_DAY_MS) / GAME_DAY_MS; }
function lerp(a,b,p){return a+(b-a)*p;}
function skyRGB(t){
  let r,g,b;
  if(t<0.25){const p=t/0.25;r=lerp(5,220,p);g=lerp(5,120,p);b=lerp(20,60,p);}
  else if(t<0.5){const p=(t-.25)/.25;r=lerp(220,100,p);g=lerp(120,180,p);b=lerp(60,220,p);}
  else if(t<0.75){const p=(t-.5)/.25;r=lerp(100,240,p);g=lerp(180,100,p);b=lerp(220,50,p);}
  else{const p=(t-.75)/.25;r=lerp(240,5,p);g=lerp(100,5,p);b=lerp(50,20,p);}
  return{r:Math.round(r),g:Math.round(g),b:Math.round(b)};
}

function drawFloor1(isNight, sky){
  const c=bg;
  c.textBaseline='top';
  const RW = HOUSE_WIDTH; 

  // Pared fondo
  const ceilH = 28;
  const floorTop = FLOOR;
  c.font='11px monospace';
  c.fillStyle = isNight ? '#0a0a1a' : '#111120';
  c.fillRect(0, 0, RW, H);

  // Techo
  c.font='11px monospace';
  const ceilBrick1 = isNight ? '#3a2a10' : '#4a3518';
  const ceilBrick2 = isNight ? '#2a1a08' : '#3a2808';
  for(let bx=0; bx<RW; bx+=22){
    c.fillStyle = ((Math.floor(bx/22))%2===0) ? ceilBrick1 : ceilBrick2;
    c.fillText('=', bx, 2);
    c.fillText('=', bx, 12);
  }
  c.fillStyle='#cc9944';
  for(let bx=0; bx<RW; bx+=8) c.fillText('-', bx, ceilH-4);
  c.fillStyle='#aa7733';
  for(let bx=0; bx<RW; bx+=8) c.fillText('_', bx, ceilH+1);

  // Piso
  for(let row=0; row<Math.ceil((H-floorTop)/13); row++){
    const y2 = floorTop + row*13;
    c.fillStyle = row%2===0 ? '#4a2810' : '#3a2008';
    let bx = 0 + ((row%2)*55);
    while(bx < RW){
      c.fillText('_', bx, y2);
      bx += 8;
    }
  }
  c.fillStyle='#6a3a18';
  for(let bx=0; bx<RW; bx+=8) c.fillText('_', bx, floorTop);

  // Tapiz de pared puntos
  c.fillStyle = isNight ? '#ffffff18' : '#ffffff10';
  for(let y2=ceilH+10; y2<floorTop-6; y2+=22)
    for(let x2=(y2%44===0?0:11); x2<RW; x2+=22) c.fillText('.',x2,y2);

  // MUEBLES HASTA EL LÍMITE DE LA IMAGEN
  drawBookshelf(c, 40, floorTop);
  drawBed(c, 240, floorTop-88);
  drawNightstand(c, 440, floorTop-62);
  drawBigWindow(c, 240, floorTop-390, isNight, sky);
  drawHangingLamp(c, 560, ceilH, isNight);
  drawPlant(c, 610, floorTop-72, 'tall');
  drawPlant(c, 670, floorTop-56, 'small');
  drawPicture(c, 650, floorTop-480, 'luna');
  drawSofa(c, 750, floorTop-78);
  drawCoffeeTable(c, 880, floorTop-30);
  drawBigWindow(c, 960, floorTop-390, isNight, sky);
  drawPouffe(c, 980, floorTop-48);
  drawHangingLamp(c, 1140, ceilH, isNight);
  drawRack(c, 1160, floorTop-90);
  drawFloorLamp(c, 1330, floorTop, isNight);
  drawBigWindow(c, 1380, floorTop-390, isNight, sky);
  drawPicture(c, 1440, floorTop-480, 'misifu');
  drawDesk(c, 1560, floorTop);
  drawHangingLamp(c, 1740, ceilH, isNight);
  drawMirror(c, 1780, floorTop-350, isNight);
  drawPlant(c, 1870, floorTop-72, 'tall');
  drawPlant(c, 1930, floorTop-56, 'small');
  
  // Fin de la habitación justo después de las plantas anteriores

  c.fillStyle='#cc9944';
  for(let bx=0; bx<RW; bx+=8) c.fillText('-', bx, ceilH-4);
}

function drawSofa(c,x,y){
  const lines=['  _____________________  ',' |_____________________| ',' | [=====] [=========] | ',' | |     | |         | | ',' | |_____| |_________| | ',' |_____________________| ','   ||               ||   ','   ++_______________++   '];
  c.font='11px monospace';
  lines.forEach((l,i)=>{ c.fillStyle=i<2?'#7a3a20':(i===6||i===7)?'#4a2010':'#6a3018'; c.fillText(l,x,y+i*12); });
}

function drawCoffeeTable(c,x,y){
  const lines=[' ___________','|___________|',' ||       || ',' ||       || ','  =========  '];
  c.font='11px monospace';
  lines.forEach((l,i)=>{ c.fillStyle=i<2?'#8B6040':(i===4)?'#6a4020':'#5a3010'; c.fillText(l,x,y+i*11); });
}

function drawDesk(c,x,y){
  const lines=[' [~] [book]  ','+===========+','|           |','+===========+',' ||       || ','_||_______||_'];
  c.font='11px monospace';
  lines.forEach((l,i)=>{ c.fillStyle=i===0?'#88aacc':(i===1||i===3)?'#8B6040':(i>=4)?'#5a3010':'#7a5030'; c.fillText(l,x,y-66+i*11); });
  const monLines=['+----------+','| .  .  . |','|  ~~~~~~  |','+----------+','    |||||   ','  _______   '];
  c.font='10px monospace';
  monLines.forEach((l,i)=>{ c.fillStyle=i===0||i===3?'#334455':(i>=4)?'#4a3010':(i===1)?'#88aaee':'#224466'; c.fillText(l,x+10,y-132+i*11); });
}

function drawFloorLamp(c,x,y,isNight){
  const lines=['  /\\  ','  ||  ','  ||  ','  ||  ',' /  \\ ','/____\\'];
  c.font='12px monospace'; const top=y-88;
  lines.forEach((l,i)=>{ c.fillStyle=(i===0&&isNight)?'#ffdd66':(i===0)?'#443322':'#8B5A2B'; c.fillText(l,x,top+i*13); });
  if(isNight){ c.fillStyle='rgba(255,220,60,0.20)'; [' . . . ',' .   . ','. . . .',' .   . ',' . . . '].forEach((gr,i)=>c.fillText(gr, x-10, top+i*12-10)); }
}

function drawBookshelf(c,x,y){
  const lines=['+===========+','|[##][##][#]|','|[#][###][##]|','+===========+','|[##][#][###]|','|[###][##][#]|','+===========+',' ||        ||'];
  const colors=['#5a3010','#cc4422','#2244aa','#22aa44','#aa8822','#884422','#5a3010','#3a1a08'];
  c.font='10px monospace';
  lines.forEach((l,i)=>{ c.fillStyle=colors[i]||'#5a3010'; c.fillText(l,x,y-96+i*12); });
}

function drawMirror(c,x,y,isNight){
  const lines=['+----------+','|  /\\_/\\   |','| (  ^  )  |','|  reflection|','|  ~~~~~~  |','+----------+','    ||||    ','  [______]  '];
  c.font='11px monospace';
  lines.forEach((l,i)=>{ c.fillStyle=(i===0||i===5)?'#aaaaaa':(i>=6)?'#8B6040':(i===1||i===2)?'#ccccaa':'#888888'; c.fillText(l,x,y+i*14); });
  if(isNight){ c.fillStyle='#ffffff22'; c.fillText('   * * ', x+2, y+18); c.fillText('  .   .  ', x+2, y+32); }
}

function drawBigWindow(c,x,y,isNight,sky){
  c.font='12px monospace';
  const interior = isNight ? '. * . * . * . * . * . * . * . * . * .' : '~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~';
  for(let i=0;i<19;i++){ c.fillStyle = isNight ? (i%2===0 ? '#aabbcc' : '#8899bb') : (i%2===0 ? '#88aacc' : '#6699bb'); c.fillText(interior, x+8, y+14+i*14); }
  const frame=['+'+'-'.repeat(38)+'+','|'+' '.repeat(38)+'|','|'+' '.repeat(38)+'|','|'+' '.repeat(38)+'|','|'+' '.repeat(38)+'|','|'+' '.repeat(38)+'|','|'+' '.repeat(38)+'|','|'+' '.repeat(38)+'|','|'+' '.repeat(38)+'|','+'+'-'.repeat(18)+'+'+'-'.repeat(19)+'+','|'+' '.repeat(38)+'|','|'+' '.repeat(38)+'|','|'+' '.repeat(38)+'|','|'+' '.repeat(38)+'|','|'+' '.repeat(38)+'|','|'+' '.repeat(38)+'|','|'+' '.repeat(38)+'|','|'+' '.repeat(38)+'|','|'+' '.repeat(38)+'|','+'+'-'.repeat(38)+'+'];
  frame.forEach((l,i)=>{ c.fillStyle=(i===0||i===9||i===19)?'#cc9944':'#8B5A2B'; c.fillText(l, x, y+i*14); });
}

function drawPicture(c,x,y,who){
  const lines = ['+------------------------+','|    /\\_/\\               |','|   ( ^.^ )              |','|     n  n               |','|   . . . . . . . . .    |','+------------------------+'];
  if(who==='luna' && typeof CAT_NAME !== 'undefined'){ lines[2] = '|   ( ^.^ )  '+('~'+CAT_NAME.slice(0,8)+'~').padEnd(12)+'|'; }
  c.font='12px monospace';
  lines.forEach((l,i)=>{ c.fillStyle=(i===0||i===5)?'#aa7733':'#e8c888'; c.fillText(l,x,y+i*14); });
}

function drawBed(c,x,y){
  const lines=['  ___________________',' /####################\\','|######################|','|======================|','|______________________|','||                    ||','++____________________++'];
  c.font='11px monospace';
  lines.forEach((l,i)=>{ c.fillStyle=(i<3)?'#6a3a2a':(i<5)?'#8B4513':'#5a2e10'; c.fillText(l,x,y+i*12); });
}

function drawPlant(c,x,y,size){
  c.font='12px monospace';
  if(size==='tall'){ ['  ( )',' (   )','(     )','  |||  ','  |||  ',' _|||_ ','|_____|'].forEach((l,i)=>{ c.fillStyle=i<3?'#2a6a2a':(i<5?'#4a3010':'#6a4010'); c.fillText(l,x,y+i*13); }); }
  else { [' (o) ','(   )',' ||| ','_|_|_'].forEach((l,i)=>{ c.fillStyle=i<2?'#3a7a3a':(i<3?'#4a3010':'#6a4010'); c.fillText(l,x,y+i*13); }); }
}

function drawRack(c,x,y){
  const lines=[' _________________________ ','|_________________________|','| [==================]   |','| [==================]   |','|_________________________|',' ||                     || ',' ++_____________________++ '];
  c.font='11px monospace';
  lines.forEach((l,i)=>{ c.fillStyle=i===2||i===3?'#224488':(i===0||i===5||i===6)?'#4a2e10':'#3a2010'; c.fillText(l,x,y+i*12); });
}

function drawHangingLamp(c,x,y,isNight){
  const cableLen = FLOOR - 390 - y - 40;
  c.font='13px monospace'; c.textBaseline='top'; c.fillStyle='#8B5A2B';
  for(let cy2=y; cy2<y+cableLen; cy2+=14) c.fillText('|', x-4, cy2);
  const lines=['   /\\   ','  /##\\  ',' /####\\     ','/######\\'];
  lines.forEach((l,i)=>{ c.fillStyle=isNight?'#ffdd66':'#554433'; c.fillText(l, x-32, y+cableLen+i*14); });
  if(isNight){ c.fillStyle='rgba(255,220,60,0.18)'; [{y:0,chars:'  .  .  .  '},{y:14,chars:' .  .  .  . '},{y:28,chars:'.  .  .  .  .'},{y:42,chars:' .  .  .  . '},{y:56,chars:'  .  .  .  '}].forEach(hr=>c.fillText(hr.chars, x-48, y+cableLen+54+hr.y)); }
}

function drawNightstand(c,x,y){
  const lines=['+-------+','|  [o]  |','|-------|','|       |','+-------+',' ||   || '];
  c.font='11px monospace';
  lines.forEach((l,i)=>{ c.fillStyle=i===1?'#cc9955':(i===0||i===4)?'#7a4a20':'#5a3210'; c.fillText(l,x,y+i*12); });
}

function drawPouffe(c,x,y){
  const lines=['  .~~~~~~~~~.  ',' (  * o  * )   ','(   o  * o   )',' (  * o  * ) ',"  '~~~~~~~~~'  "];
  c.font='11px monospace';
  lines.forEach((l,i)=>{ c.fillStyle = i===0||i===4 ? '#cc8855' : i===2 ? '#dd9966' : '#bb7744'; c.fillText(l, x, y+i*12); });
}

// ── LOOP PRINCIPAL ──
function drawBG(){
  const t=getT(); const {r,g,b}=skyRGB(t); const isNight=(t<0.22||t>0.78); const sky=`rgb(${r},${g},${b})`;
  document.getElementById('clock').textContent=new Date().getHours().toString().padStart(2,'0')+':'+new Date().getMinutes().toString().padStart(2,'0');
  bg.clearRect(0,0,W,H); bg.save(); bg.translate(worldX,0); drawFloor1(isNight,sky); bg.restore();
}

function drawCat(sp,x,y,flip){
  const lines=SP[sp];
  ctx.save(); ctx.font='13px monospace'; ctx.textBaseline='top'; ctx.fillStyle='#ffffff';
  const sw=lines[0].length*CH_W;
  if(flip){ ctx.translate(x+sw,y); ctx.scale(-1,1); ctx.translate(-x,-y); }
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*LH));
  ctx.restore();
}

let bubTimer=null; let bubText='', bubVisible=false;
function showBubble(txt){
  clearTimeout(bubTimer); bubText=txt; bubVisible=true;
  const b=document.getElementById('bubble'); b.textContent=txt; b.classList.add('show');
  bubTimer=setTimeout(()=>{b.classList.remove('show');bubVisible=false;},3000);
}
function updateBubblePos(){
  if(!bubVisible) return;
  const b=document.getElementById('bubble');
  b.style.left=Math.min(cat.x+worldX+8,W-140)+'px'; 
  b.style.top=Math.max(cat.y-80,4)+'px';
}

let isDrag=false,dragOx=0,dragOy=0, lunaVHist=[], lunaLmx=0, lunaLmy=0, lunaLt=0;
function startDrag(mx,my){
  const realMx = mx - worldX;
  if(Math.abs(realMx-(cat.x+40))<52&&Math.abs(my-(cat.y-30))<44){
    isDrag=true;cat.dragging=true;dragOx=realMx-cat.x;dragOy=my-cat.y;
    cat.vx=0;cat.vy=0;lunaLmx=realMx;lunaLmy=my;lunaLt=performance.now();lunaVHist=[];
    cvs.classList.add('grabbing');setForce('grab',99999);showBubble('!!! o.O');
  }
}
function moveDrag(mx,my){
  if(isDrag){
    const realMx = mx - worldX;
    cat.x=realMx-dragOx;cat.y=my-dragOy;
    const now=performance.now(), dt=now-lunaLt;
    lunaVHist.push({vx:(realMx-lunaLmx)/Math.max(dt,1)*16, vy:(my-lunaLmy)/Math.max(dt,1)*16, t:now});
    if(lunaVHist.length>6) lunaVHist.shift();
    lunaLmx=realMx;lunaLmy=my;lunaLt=now;
  }
}
function endDrag(){
  if(isDrag){
    isDrag=false;cat.dragging=false;cvs.classList.remove('grabbing');forceSp=null;
    const recent=lunaVHist.filter(v=>performance.now()-v.t<80);
    if(recent.length>0){
      cat.vx=recent.reduce((s,v)=>s+v.vx,0)/recent.length;
      cat.vy=recent.reduce((s,v)=>s+v.vy,0)/recent.length;
    } else { cat.vx=0;cat.vy=0; }
    showBubble('miau!!');
  }
}

function setForce(s,ms){forceSp=s;forceMs=ms;}
function updateSprite(dt){
  if(forceSp){curSp=forceSp;forceMs-=dt;if(forceMs<=0)forceSp=null;return;}
  if(S.sleeping){sleepB+=dt;curSp=sleepB>900?'slp1':'slp0';if(sleepB>1800)sleepB=0;return;}
  if(Math.min(S.food,S.fun,S.love)<15){curSp='sad';return;} if(S.food<20){curSp='hung';return;}
  if(!cat.onFloor){curSp=cat.vy<0?'play':'sit';}
  else if(Math.abs(cat.vx)>0.5){ walkT+=dt;if(walkT>80){walkT=0;walkF=1-walkF;} curSp=walkF?'walk1':'walk0'; }
  else curSp='sit';
}

function updatePhysics(dt){
  if(cat.dragging)return;
  cat.vy+=GRAV;cat.x+=cat.vx;cat.y+=cat.vy;
  if(cat.y>=FLOOR){cat.y=FLOOR;cat.vy*=-BOUNCE;cat.onFloor=true;if(Math.abs(cat.vy)<0.8)cat.vy=0;}
  else cat.onFloor=false;
  
  // Límites precisos del gato dentro de la nueva casa recortada
  if(cat.x<4){cat.x=4;cat.vx=Math.abs(cat.vx)*0.85;}
  if(cat.x>HOUSE_WIDTH-90){cat.x=HOUSE_WIDTH-90;cat.vx=-Math.abs(cat.vx)*0.85;}
  if(cat.y<30){cat.y=30;cat.vy=Math.abs(cat.vy)*0.4;}
  
  if(cat.onFloor&&!forceSp&&!S.sleeping){
    const minSpd=2.0;
    if(Math.abs(cat.vx)<minSpd) cat.vx = cat.vx>=0 ? minSpd : -minSpd;
    sitT+=dt;
    if(sitT>700+Math.random()*600){
      sitT=0; if(Math.random()<0.55){ cat.vy=-(8+Math.random()*5); }
    }
  }
}

let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(ts-last,50);last=ts;
  drawBG();updatePhysics(dt);updateSprite(dt);updateBubblePos();
  ctx.clearRect(0,0,W,H);
  
  ctx.save();
  ctx.translate(worldX,0); 
  ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(cat.x+44,FLOOR+3,26,5,0,0,Math.PI*2);ctx.fill();
  drawCat(curSp,cat.x,cat.y-56,cat.vx<-0.4&&!cat.dragging);
  if(cat.dragging){ctx.strokeStyle='#ffffff33';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.strokeRect(cat.x+2,cat.y-58,84,62);ctx.setLineDash([]);}
  ctx.restore();
}
requestAnimationFrame(loop);

function setMsg(m){document.getElementById('msg').textContent=m;}
document.getElementById('msg').textContent = (typeof CAT_NAME!=='undefined'?CAT_NAME:'mi gato')+': miau~ :3';
function cl(v){return Math.max(0,Math.min(100,v));}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}

function feed(){if(S.sleeping){wakeUp();return;}S.food=cl(S.food+25);S.sleep=cl(S.sleep-5);setForce('love',1600);cat.vx=0;showBubble(rnd(['nyam nyam!','gracias! :)','que rico~']));setMsg(CAT_NAME+' come feliz ^o^');}
function play(){if(S.sleeping){wakeUp();return;}S.fun=cl(S.fun+25);S.food=cl(S.food-8);S.sleep=cl(S.sleep-8);setForce('play',400);cat.vx=(cat.vx>0?1:-1)*6;cat.vy=-12;showBubble('miau!! >w<');setMsg(CAT_NAME+' juega! :D');}
function pet(){if(S.sleeping){wakeUp();return;}S.love=cl(S.love+25);S.sleep=cl(S.sleep-3);setForce('pet',1800);cat.vx*=0.1;showBubble('purr purr~ <3');setMsg(CAT_NAME+' ronronea :)');}
function doSleep(){
  if(S.sleeping){wakeUp();return;}
  S.sleeping=true;cat.vx=0;cat.vy=0;setForce('slp0',99999);showBubble('zzzz...');setMsg(CAT_NAME+' duerme... (-_-)z');
  const si=setInterval(()=>{S.sleep=cl(S.sleep+10);if(S.sleep>=100){clearInterval(si);wakeUp();}},600);
  window._si=si;
}
function wakeUp(){S.sleeping=false;clearInterval(window._si);forceSp=null;cat.vx=1;showBubble('buen dia! ^w^');setMsg(CAT_NAME+' se desperto~ :)');}
setInterval(()=>{
  if(!S.sleeping){S.food=cl(S.food-1);S.fun=cl(S.fun-1);S.love=cl(S.love-.5);S.sleep=cl(S.sleep-.8);
  if(Math.min(S.food,S.fun,S.love,S.sleep)<15)setMsg(CAT_NAME+' necesita atencion ;_;');}
},3000);

// Arrastre de cámara acotado perfectamente al nuevo límite
let houseDrag=false, houseDragStartX=0, houseDragWorldX=0;
function startHouseDrag(mx){ houseDrag=true; houseDragStartX=mx; houseDragWorldX=worldX; }
function moveHouseDrag(mx){
  if(!houseDrag) return;
  const dx = mx - houseDragStartX;
  // Bloqueo estricto para evitar que la cámara muestre fondos negros
  worldX = Math.min(0, Math.max(-HOUSE_WIDTH + W, houseDragWorldX + dx));
}
function endHouseDrag(){ houseDrag=false; }

cvs.addEventListener('mousedown', function(e){
  const r=cvs.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const realMx = mx - worldX;
  const hitLuna = Math.abs(realMx-(cat.x+40))<52 && Math.abs(my-(cat.y-30))<44;
  if(hitLuna) startDrag(mx,my);
  else        startHouseDrag(mx);
});
cvs.addEventListener('mousemove', function(e){
  const r=cvs.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const realMx = mx - worldX;
  if(isDrag) moveDrag(mx,my); 
  else       moveHouseDrag(mx);
  const hitLuna = Math.abs(realMx-(cat.x+40))<52 && Math.abs(my-(cat.y-30))<44;
  cvs.style.cursor = hitLuna ? 'grab' : 'ew-resize';
});
cvs.addEventListener('mouseup',   ()=>{ endDrag(); endHouseDrag(); });
cvs.addEventListener('mouseleave',()=>{ endDrag(); endHouseDrag(); });
</script>
